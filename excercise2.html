<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    
<table 
border="1"
width="500px"
>

    <th colspan="4">Table</th>

    <tr>
        <th>A</th>
        <th colspan="2">B</th>
        <th>C</th>
    </tr>
    <tr>
        <th rowspan="2">D</th>
        <th colspan="3">F</th>
    </tr>
    <tr>
        <th>G</th>
        <th colspan="2">H</th>
    </tr>
    <tr>
        <th colspan="3">J</th>
        <th>I</th>
    </tr>
    <tr>
        <th>K</th>
        <th>L</th>
        <th>M</th>
        <th rowspan="2">N</th>
    </tr>
    <tr>
        <th colspan="3">O</th>
    </tr>
</table>


</body>
</html>
