<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <form  style="width:300px; margin: auto; border:2px solid black; border-radius: 10px; padding:15px">
        <h1><b><u>Student Information</u></b></h1>

        <p>Enter Your Information</p>

        <label >Enter FullName</label><br>
        <input type="Text" name="name"><br><br>

        <label>Enter Email</label><br>
        <input type="email" name="email"><br><br>

        <label>Gender</label><br>
        <input type="checkbox" name="male">
        <label>Male</label><br>

        <input type="checkbox" name="female">
        <label>Female</label><br><br>

        <label>Date of Birth</label>
        <input type="date" name="date"><br><br>

        <label>Which one is ur skill?</label><br>
        <input type="radio" name="Programming">
        <label>Programming</label>

        <input type="radio" name="Network">
        <label>Network</label><br><br>

        <label><b><u>Top of Technology-Skill</u></b></label><br>
        <label><b>C++: 70%</b></label>
        <input type="range" vaule="70"><br>

        <label><b>C#: 60%</b></label>
        <input type="range" vaule="60"><br>

        <label><b>Java Script: 40%</b></label>
        <input type="range" vaule="40"><br>

        <input type="checkbox">
        <label>Do you want to remember me?</label><br><br>

        <input type="submit" vaule="Submit">
        <input type="reset" vaule="Clear">
    </form> 

</body>
</html>
