<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <style>
        body{
            background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTpF7xDsFmV2XiYOKELajnSxUNoUTopRK-H6_BulMe5Eg&s=10);
            background-repeat: no-repeat;
            background-size: cover;
        }
        .form{
            width:350px;
            margin: 90px auto;
            padding:60px;
            background-color: rgb(46, 46, 47, 0.714);
            border: 1px solid gray;
            border-radius: 20px;
        }
        .title-contact{
            color:rgb(235,99,14);
            font-size: 35px;
            text-align: center;
        }
        .sub-title{
            color: aliceblue;
            text-align: center;
        }
        .label-input{
            color: aliceblue;
            font-size: 25px;
        }
        .input-form{
            width: 98%;
            border: none;
            border-radius: 30px;
            font-style: italic;
            font-size: 20px;
            background-color: rgb(152,153,154,0.568);
            box-shadow: 1px, 0px, 10px, 11px, rgb(21,21,20,0,371)insert;
            padding: 10px;
            color:aliceblue;
        }
    </style>
</head>
<body>
   
    <form action="" class="form">
        <h1 class="title-contact">Contact for more</h1>
        <p class="sub-title">Please contact for more<br>
           Can contact if you have question.</p>

        <label>First Name</label><br>
        <input class="input-form" type="text" name="name" id=""><br><br>

        <label class="label-input">Last Name</label><br>
        <label class="label-input">Email Address</label><br>
    </form>

</body>
</html>
