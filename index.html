<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <table 
    border="1"
    width="700px"
    align="center"
    cellpadding="10px"
    cellspecing="0">
  
         <tr>
            <th colspan="4">Student Information</th>
         </tr>

         <tr>
           <th>ID</th>
           <th>Name</th>
           <th>Gender</th>
           <th>Result</th>
         </tr>
         
         <tr>
            <td>01</td>
            <td>Lali</td>
            <td>Female</td>
            <td rowspan="2">Pass</td>
         </tr>

         <tr>
            <td>02</td>
            <td>Mike</td>
            <td>Male</td>
         </tr>

    </table>
</body>
</html>
