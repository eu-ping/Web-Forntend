<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    
     <table 
     border="1"
     Width="700px">

        <th colspan="5">Table</th>

        <tr>
            <th rowspan="2">A</th>
            <th colspan="3">B</th>
            <th>C</th>
        </tr>

        <tr>
            <th>D</th>
            <th colspan="2">E</th>
            <th colspan="2">F</th>
        </tr>

        <tr>
            <th colspan="3">G</th>
            <th rowspan="2" colspan="2">h</th>
        </tr>

        <tr>
            <th colspan="2">I</th>
            <th>J</th>
        </tr>

        <tr>
            <th rowspan="2" colspan="2">K</th>
            <th>L</th>
            <th colspan="">M</th>
            <th colspan="">N</th>
        </tr>

        <tr>
            <th>O</th>
            <th colspan="2">P</th>
        </tr>

     </table>

</body>
</html>
